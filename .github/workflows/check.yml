name: check

# Run this from the Actions tab when something is not working. It reports which of the
# two keys is broken, which models your key can actually reach, and whether search
# grounding works, without placing any orders.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Models to test-call, comma-separated (optional)"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -e .
      - name: Diagnose
        env:
          MANIFOLD_API_KEY: ${{ secrets.MANIFOLD_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          PROBE: ${{ inputs.probe }}
        run: |
          python run.py --check --probe "$PROBE" | tee report.txt
          {
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

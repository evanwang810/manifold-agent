name: tick

# GitHub's scheduler is best effort and drops high-frequency crons under load, so a */5
# schedule really fires every one to two hours. The workaround is both halves of this:
# the job loops internally for most of an hour so ticks happen on a real interval, and
# the cron asks every five minutes so a session starts promptly after the last one ends
# rather than waiting for the top of the next hour. The concurrency group below keeps at
# most one session running and one queued, and the queued one starts the moment the
# running one finishes. Wall time is free on public repositories.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      instruction:
        description: "One-off instruction for this run"
        required: false
        type: string
      live:
        description: "Place real orders (overrides config.toml)"
        required: false
        type: boolean
        default: false
      minutes:
        description: "How long to keep ticking"
        required: false
        default: "55"

concurrency:
  group: manifold-agent
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      # A tick with nothing to react to costs zero LLM calls: it is a handful of
      # Manifold reads, and 8 requests a minute against a 500/minute limit is nothing.
      # The expensive work is gated separately, by max_evaluations_per_tick and by
      # min_minutes_between_scans, so checking every minute buys reactivity for free.
      TICK_INTERVAL_SECONDS: 60
      SESSION_MINUTES: ${{ inputs.minutes || '55' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet -e .

      # Without this the schedule would fail on every fork that has not been set up
      # yet, which is a lot of email for something that is simply not configured.
      - name: Check secrets
        id: guard
        env:
          MANIFOLD_API_KEY: ${{ secrets.MANIFOLD_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$MANIFOLD_API_KEY" ] || [ -z "$LLM_API_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Not configured yet"
              echo ""
              echo "Add \`MANIFOLD_API_KEY\` and \`LLM_API_KEY\` under"
              echo "Settings → Secrets and variables → Actions, and this starts running."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # The state branch holds the agent's memory. Created on first run so a fork needs
      # no manual git surgery.
      - name: Fetch state
        if: steps.guard.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone --quiet --depth 1 --branch state "$REMOTE" state 2>/dev/null; then
            echo "state branch does not exist yet, creating it"
            mkdir -p state
            git -C state init --quiet --initial-branch=state
            git -C state remote add origin "$REMOTE"
          fi
          git -C state config user.name "manifold-agent"
          git -C state config user.email "manifold-agent@users.noreply.github.com"

      - name: Tick
        if: steps.guard.outputs.ready == 'true'
        env:
          MANIFOLD_API_KEY: ${{ secrets.MANIFOLD_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_INSTRUCTION: ${{ inputs.instruction }}
          LIVE_FLAG: ${{ inputs.live && '--live' || '' }}
        run: |
          # The reply workflow pushes to the same branch, so a race is normal. State is a
          # snapshot rather than a history, so the newest writer simply wins: rebasing
          # produced conflicts in public.json, and a rejected push used to kill the whole
          # session. Nothing here is allowed to end the loop.
          push_state() {
            cd state
            git add -A
            if git diff --staged --quiet; then cd ..; return 0; fi
            git commit --quiet -m "state: $(date -u +%FT%TZ)"
            for attempt in 1 2 3; do
              if git push --quiet origin HEAD:state 2>/dev/null; then cd ..; return 0; fi
              # Re-parent our snapshot onto whatever landed while we were working. The
              # working tree is untouched, so our files win and the push fast-forwards.
              git fetch --quiet origin state || true
              git reset --soft origin/state || true
              git add -A
              git diff --staged --quiet && break
              git commit --quiet -m "state: $(date -u +%FT%TZ)" || true
              sleep 3
            done
            echo "could not push state, carrying on"
            cd ..
          }

          END=$(( $(date +%s) + SESSION_MINUTES * 60 ))
          N=0
          while :; do
            N=$((N + 1))
            echo "::group::tick $N"
            python run.py $LIVE_FLAG || echo "tick $N failed, continuing"
            echo "::endgroup::"

            push_state || echo "state push failed, continuing"

            [ "$(date +%s)" -ge "$END" ] && break
            sleep "$TICK_INTERVAL_SECONDS"
          done
          echo "completed $N ticks" >> "$GITHUB_STEP_SUMMARY"

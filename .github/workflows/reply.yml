name: reply

# Questions used to sit unanswered until the next scheduled session happened to start,
# which can be half an hour away when the scheduler drops crons. This runs one tick the
# moment somebody opens or comments on a thread, so the agent answers while you are
# still looking at the page.
on:
  issues:
    types: [opened, labeled, reopened]
  issue_comment:
    types: [created]

# Deliberately not the tick workflow's concurrency group: waiting for a 55-minute
# session to finish is exactly the delay this exists to remove.
concurrency:
  group: manifold-agent-reply
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  reply:
    # Skip its own replies, and anything not addressed to it.
    if: >
      github.event.sender.type != 'Bot' &&
      (github.event.issue.labels[0].name == 'ask-the-bot' ||
       contains(join(github.event.issue.labels.*.name, ','), 'ask-the-bot'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet -e .

      - name: Check secrets
        id: guard
        env:
          MANIFOLD_API_KEY: ${{ secrets.MANIFOLD_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$MANIFOLD_API_KEY" ] || [ -z "$LLM_API_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch state
        if: steps.guard.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone --quiet --depth 1 --branch state "$REMOTE" state 2>/dev/null; then
            mkdir -p state
            git -C state init --quiet --initial-branch=state
            git -C state remote add origin "$REMOTE"
          fi
          git -C state config user.name "manifold-agent"
          git -C state config user.email "manifold-agent@users.noreply.github.com"

      - name: Tick once
        if: steps.guard.outputs.ready == 'true'
        env:
          MANIFOLD_API_KEY: ${{ secrets.MANIFOLD_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python run.py

          # Same race as the tick workflow, handled the same way: re-parent onto whatever
          # landed and let the newest snapshot win, rather than rebasing into a conflict.
          cd state
          git add -A
          if ! git diff --staged --quiet; then
            git commit --quiet -m "state: reply $(date -u +%FT%TZ)"
            for attempt in 1 2 3; do
              git push --quiet origin HEAD:state 2>/dev/null && exit 0
              git fetch --quiet origin state || true
              git reset --soft origin/state || true
              git add -A
              git diff --staged --quiet && exit 0
              git commit --quiet -m "state: reply $(date -u +%FT%TZ)" || true
              sleep 3
            done
            echo "could not push state"
          fi

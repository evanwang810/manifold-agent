# Settings only. This file is committed, so it holds no keys.
# Secrets come from the environment: MANIFOLD_API_KEY and LLM_API_KEY.

[manifold]
# Master safety switch. While true, orders and comments are logged, never sent.
# Set back to true at any time to ground the bot without stopping the workflow.
dry_run = false

[llm]
# Three models. Anything set here is the shared default; the tables below override it.
# Point them all at the same model if you would rather not think about it.
#
# provider is one of: gemini | mistral | openai_compatible
#
# Nothing below is Gemini-specific except the model names. If you are forking this onto
# another provider, the three things to change are: the model in each tier, `provider`
# (plus `base_url` for openai_compatible), and the [budget] daily caps, which are set for
# a 20-a-day free tier and are almost certainly wrong for yours. Run
# `python run.py --check` first; it reports each tier separately.
#
# Gemini is the default because its native Google Search grounding means research needs
# no second key. Everywhere else, research falls back to keyless DuckDuckGo, which the
# agent handles on its own. Mistral, Groq, Cerebras and OpenRouter all have free tiers
# that do not ask for a card.
provider = "gemini"
base_url = ""
use_search = true             # false skips the research call entirely
search_results = 6
temperature = 0.3
timeout_seconds = 90
# Uncomment for a model that rejects system prompts or response schemas outright and
# answers 400 rather than ignoring them. Gemma is detected automatically.
# prompt_only = true
# Spacing between calls to the provider, shared across tiers. Free tiers rate limit per
# minute as well as per day, and a burst of calls in one tick is what trips it.
min_seconds_between_calls = 20
key_env = "LLM_API_KEY"       # which environment variable holds the key

# Every tier takes `fallbacks`: models tried in order when the preferred one is out of
# quota or refuses the key. A daily free quota runs out before the day does, and a
# lesser model is better than the agent going dark until midnight.

# Screens every candidate market and does the research. Highest call volume, so it
# wants the model with the generous rate limit rather than the clever one.
[llm.fast]
model = "gemini-3.5-flash-lite"
fallbacks = ["gemini-3.5-flash"]

# Talks to people and rewrites memory. Gemma is the point of this tier: its limits are
# generous enough that conversation costs nothing against the 20-a-day Gemini quota the
# trading decisions have to live inside. It is served over the same endpoint but takes
# no system instruction and no response schema, which the client handles by folding
# both into the prompt.
[llm.chat]
model = "gemma-4-31b-it"
fallbacks = ["gemma-4-26b-a4b-it", "gemini-3.5-flash-lite"]

# Only ever asked the question that decides money. To run a second provider here, set
# its own provider/base_url/key_env and add that key to Actions secrets, for example:
#   provider = "openai_compatible"
#   base_url = "https://api.groq.com/openai/v1"
#   model = "llama-3.3-70b-versatile"
#   key_env = "DEEP_LLM_API_KEY"
[llm.deep]
# Each of these carries its own daily quota, so the chain is also what the agent falls
# back onto once the day's 20 on the newest model are gone rather than going dark.
model = "gemini-3.7-flash"
fallbacks = ["gemini-3.6-flash", "gemini-3.5-flash", "gemini-3.5-flash-lite"]

[screen]
# The fast model forecasts each candidate blind, and the deep model only sees markets
# where that quick number disagrees with the price or where the screener flagged
# something worth reading properly. The screener is coarse, so the disagreement has to
# be sizeable before it counts as evidence: at 0.03 nearly everything escalated and the
# deep model's quota went on questions that were fairly priced all along.
enabled = true
# Calibrated from the 17 forecasts on record: their market-versus-model gaps put the
# 75th percentile at 0.081, and a 0.10 threshold passes 4 of 17. That targets roughly a
# quarter of what gets scanned. Every screen now logs its own gap and verdict, so this
# can be re-derived properly once there is enough screener data to beat the proxy.
escalate_edge = 0.15

[budget]
# The deep tier is the binding constraint on the whole agent, and this cap is what
# stops it before the provider does. Count the quota of every model in the deep chain,
# not just the first: each has its own 20 a day, and the chain only advances once a
# model actually answers 429. Two models means about 40, so 34 leaves headroom for
# retries and for the reviewer calls the agency turn makes. At 34 analyses a day that
# is roughly 130 markets screened at a 25% pass rate.
max_evaluations_per_tick = 2
max_fast_calls_per_tick = 4
max_chat_calls_per_tick = 4
max_deep_calls_per_tick = 1
max_fast_calls_per_day = 220
max_chat_calls_per_day = 400
max_deep_calls_per_day = 34
# Without pacing a daily cap is gone in the first ten minutes and the agent is dark
# until midnight. Calls are released against the clock instead, and the burst is how
# far ahead of it a tier may run so it can still react to something immediately.
pace_burst = 3

[scan]
# 36 scans a day at 4 markets each is 144 screens, which at a 25% pass rate is about 36
# candidates for a deep model that can afford 18. Pacing absorbs the difference, and
# screening more than the deep model can take is the cheapest way to see more markets.
min_minutes_between_scans = 40
candidates_per_scan = 4
# Loosened: the old bar (25 traders, M$3k, a month) left the screener with a thin pool
# of the same large markets, and a mispricing is likelier on a question fewer people
# have bothered to price than on one everybody is already staring at.
min_unique_bettors = 12
min_volume = 800
max_days_to_resolve = 30
min_hours_to_resolve = 6
skip_if_seen_within_hours = 24

[agency]
# The agent's own turn. Everything else it does is a reaction to something; this is the
# one place it acts unprompted, and it gets exactly one action. The cheap model proposes
# (usually "nothing", which is the intended answer), and anything touching mana is then
# reviewed by the deep model, which can veto it or cut the amount. There is no ceiling on
# a single action: the balance reserve and daily mana budget in [risk] are what bound it,
# applied in code after both models have spoken.
#
# It can sell out of a position, add to one, send mana (returning a loan, paying someone
# back, lending to someone who asked), or rewrite one of its own standing notes.
enabled = true
min_minutes_between_actions = 60
max_actions_per_turn = 3
allow_send_mana = true
# Separately, a sweep over the whole book: every open position looked at together, with
# the option to trim or add. Narrower than the free turn, since it can only touch markets
# already held, and every trade it proposes still goes through the deep reviewer.
review_positions = true
min_minutes_between_book_reviews = 60
require_review = true         # false lets the cheap model move mana unsupervised

[forecast]
# Hide the market price while the model is forecasting. Shown the price, it hands the
# price back: early runs put five of six estimates within two points of market, which
# produces no edge and no trades. Set false to let it see the price and anchor.
blind = true

[risk]
# Ordinary trades are capped as a share of net worth, floored at default_max_bet so a
# small account can still do something. A flat M$10 cap made every position identical
# regardless of how strong the edge was, which is dull and learns nothing.
default_max_bet = 10
default_max_fraction = 0.10
# A 4-point disagreement is a real, if weak, opinion and deserves a small position.
# Kelly already scales the stake with the edge, so a marginal call gets marginal money
# rather than nothing. Lower means more trades and a much faster calibration record.
min_edge = 0.04
min_bet = 8                   # floor, so a thin edge is still a real position
kelly_fraction = 0.4          # raise toward 0.7 if you want the conviction cap to bind

# All four gates have to pass at once for a big position. At the original settings
# (M$10k volume, 7 days, 18pp edge, high confidence) nothing ever cleared them.
conviction_max_fraction = 0.35
conviction_min_volume = 5000
conviction_max_days = 14
conviction_min_edge = 0.12
conviction_min_confidence = "medium"

max_market_impact = 0.05      # never move the price more than 5pp with one order
max_share_of_volume = 0.05
max_open_positions = 40
daily_mana_budget = 500
# Cash held back from every order. At 50 against a balance that had drifted down to
# M$50 this silently floored every trade to zero for a day and a half: the agent kept
# finding edges, kept sizing them at nothing, and read that as the market being fine.
# Keep it small; it is a buffer against fees, not a risk control.
min_balance_reserve = 10
time_decay_days = 10

[watch]
move_threshold = 0.08         # pp move on a held market that forces a re-evaluation
# Ticks run every minute; without this a market in freefall would burn an evaluation
# every tick on the way down.
reevaluate_cooldown_minutes = 45

[social]
# Posting costs M$1, so the bot introduces itself only on a position big enough that the
# fee is noise, and only once per market. It still answers replies to that comment for
# free, forever, and stays quiet on every later trade in the same market.
comment_decisions = true
comment_min_amount = 50
reply_to_comments = true
# Off by default: a managram is the only way to answer a managram, and the API minimum
# is M$10 per send, so every reply costs real bankroll.
reply_to_managrams = false
# Questions asked through the website arrive as labelled GitHub issues.
answer_github_issues = true
# Minimum gap between replies in the same thread. Without it a busy thread gets one
# reply per message, because every answer draws another comment which triggers another
# answer. It only ever answers the newest message anyway, so waiting costs nothing but
# the replies to messages the conversation had already moved past.
issue_reply_cooldown_minutes = 15
max_replies_per_tick = 2
watch_last_n_comments = 10    # how far back to look for replies to the bot

[memory]
path = "state"
# Compress on whichever comes first: enough decisions, enough hours, or a full journal.
# Events alone never fires on a quiet day and the context just grows.
compress_after_events = 60
compress_after_hours = 8
# Running observations, written by plain code on every tick and folded into the summary
# when it is next rewritten. Recording is free, so it notices everything and decides
# later what was worth keeping.
max_journal = 300
journal_in_context = 30
# Standing notes the agent wrote for itself or was given by someone it talked to.
# These sit in front of every decision, so the list stays short on purpose.
max_lessons = 16
conversation_depth = 12       # turns of one conversation it can still see
max_conversations = 40

# Settings only. This file is committed, so it holds no keys.
# Secrets come from the environment: MANIFOLD_API_KEY and LLM_API_KEY.

[manifold]
# Master safety switch. While true, orders and comments are logged, never sent.
# Set back to true at any time to ground the bot without stopping the workflow.
dry_run = false

[llm]
# Three models. Anything set here is the shared default; the tables below override it.
# Point them all at the same model if you would rather not think about it.
#
# provider is one of:
#   gemini | anthropic | openai | openrouter | deepseek | mistral | groq | cerebras
#   openai_compatible  (anything else speaking /chat/completions; needs base_url)
#
# Research uses the provider's own web search where it has one, and falls back to
# keyless DuckDuckGo where it does not. gemini, anthropic, openai and openrouter search
# natively. deepseek, mistral, groq and cerebras do not expose search on the endpoint
# this talks to, so those fall back. Either way research costs exactly one call, so the
# budget numbers below do not change when you switch.
#
# Nothing below is Gemini-specific except the model names. If you are forking this onto
# another provider, the three things to change are: the model in each tier, `provider`
# (plus `base_url` for openai_compatible), and the [budget] daily caps, which are set for
# a 20-a-day free tier and are almost certainly wrong for yours. Run
# `python run.py --check` first; it reports each tier separately.
#
# Gemini is the default because its free tier is generous and its search needs no
# second key. Mistral, Groq, Cerebras and OpenRouter all have free tiers that do not
# ask for a card; of those only OpenRouter can search.
provider = "gemini"
base_url = ""
use_search = true             # false skips the research call entirely
search_results = 6
temperature = 0.3
timeout_seconds = 90
# Uncomment for a model that rejects system prompts or response schemas outright and
# answers 400 rather than ignoring them. Gemma is detected automatically.
# prompt_only = true
# Spacing between calls to the provider, shared across tiers. Free tiers rate limit per
# minute as well as per day, and a burst of calls in one tick is what trips it.
min_seconds_between_calls = 20
key_env = "LLM_API_KEY"       # which environment variable holds the key

# Every tier takes `fallbacks`: models tried in order when the preferred one is out of
# quota or refuses the key. A daily free quota runs out before the day does, and a
# lesser model is better than the agent going dark until midnight.

# Screens every candidate market and does the research. Highest call volume, so it
# wants the model with the generous rate limit rather than the clever one.
[llm.fast]
model = "gemini-3.5-flash-lite"
fallbacks = ["gemini-3.5-flash"]

# Talks to people and rewrites memory. Gemma is the point of this tier: its limits are
# generous enough that conversation costs nothing against the 20-a-day Gemini quota the
# trading decisions have to live inside. It is served over the same endpoint but takes
# no system instruction and no response schema, which the client handles by folding
# both into the prompt.
[llm.chat]
model = "gemma-4-31b-it"
fallbacks = ["gemma-4-26b-a4b-it", "gemini-3.5-flash-lite"]

# Only ever asked the question that decides money. To run a second provider here, set
# its own provider/key_env and add that key to Actions secrets, for example:
#   provider = "anthropic"
#   model = "claude-sonnet-4-5"
#   key_env = "DEEP_LLM_API_KEY"
[llm.deep]
# Each of these carries its own daily quota, so the chain is also what the agent falls
# back onto once the day's 20 on the newest model are gone rather than going dark.
# Probed 2026-10-14 with `check` (Actions tab, probe input): gemini-4-argon, both Pro
# models and gemini-omni answer 429 on the first request, i.e. no free quota. They are
# deliberately not in the chain: a model that always 429s costs a wasted request and a
# throttle wait on every single call before the chain moves on. With billing enabled,
# gemini-4-argon is the one to put first.
model = "gemini-3.8-flash"
fallbacks = ["gemini-3.7-flash", "gemini-3.6-flash", "gemini-3.5-flash"]

[search]
# The fallback used when the LLM provider has no search of its own. Providers that do
# (gemini, anthropic, openai, openrouter, mistral) never reach this: their own search
# picks its own queries inside the call, so none of the settings below apply to them.
#
# backend is one of: duckduckgo | tavily | brave | serper
# duckduckgo needs no key and is scraped, so it is rate limited by whoever feels like
# it that day. The other three want one key in the environment and are markedly better
# at returning something written this week. Free tiers as of writing: Brave ~2k/month,
# Serper 2.5k once, Tavily ~1k/month. Research runs only on markets that clear the
# screener, so this is about 34 searches a day, which fits any of them.
backend = "duckduckgo"
key_env = "SEARCH_API_KEY"    # add to Actions secrets if you set a keyed backend
max_results = 6
# Drop results older than this. Prediction markets turn on what happened this week and
# an unfiltered query returns the best-ranked page of all time, which for anything with
# history is a year-old article that reads as current. 0 disables the filter.
recency_days = 30
# How many queries the model writes for itself before searching. A market question is
# written for humans and for whoever resolves it, so searching it verbatim is close to
# the worst possible query: it carries the resolution criteria, the date and often a
# joke. The question is always searched as well, in case the planner drops the one
# detail that identified the event. 0 turns planning off and saves one fast call.
plan_queries = 3

[screen]
# The fast model forecasts each candidate blind, and the deep model only sees markets
# where that quick number backs the market's favourite by enough, or where the
# screener flagged something worth reading properly.
enabled = true
# Measured in log-odds, not percentage points: 95% to 98% is a big move and 50% to 53%
# is noise, and log-odds is the unit that says so. Over 2,126 logged screens, 0.2 with
# [risk] favourites_only on passes about 24%. The old rule (a 15-point gap either way)
# passed 42%, and mostly on the screener hedging a strong favourite toward 50%, which
# the deep model then bought as a longshot.
escalate_logodds = 0.2
# Markets per screening call. Flash-lite has quota to spare, so this stays small for
# attention per market rather than squeezed for calls.
batch_size = 4

[budget]
# The deep tier is the binding constraint on the whole agent, and this cap is what
# stops it before the provider does. Count the quota of every model in the deep chain,
# not just the first: each has its own 20 a day, and the chain only advances once a
# model actually answers 429. 3.8, 3.7 and 3.6 make about 60 (3.5 Flash is shared with
# the fast tier's fallback, so it is not counted), and 54 leaves headroom for retries.
# Every sell, add and transfer on the own turn now goes through this tier too.
max_evaluations_per_tick = 3     # markets per deep call, all in one request
max_fast_calls_per_tick = 12     # three screens of four plus research for three markets
max_chat_calls_per_tick = 4
max_deep_calls_per_tick = 1
# Flash-lite's free quota is far larger than this. The cap is still worth having:
# when the fast model runs dry it falls back to gemini-3.5-flash, which shares its
# quota with the deep chain.
max_fast_calls_per_day = 400
max_chat_calls_per_day = 400
max_deep_calls_per_day = 54
# Without pacing a daily cap is gone in the first ten minutes and the agent is dark
# until midnight. Calls are released against the clock instead, and the burst is how
# far ahead of it a tier may run so it can still react to something immediately.
pace_burst = 3

[scan]
# Each scan screens every candidate in one fast-model call and sends up to
# [budget] max_evaluations_per_tick survivors to the deep model in one call. 24 scans a
# day at 10 markets is 240 markets looked at, for about 24 screen calls, 24 deep calls,
# and two research calls per analysed market on the fast tier.
min_minutes_between_scans = 60
candidates_per_scan = 10
# Loosened: the old bar (25 traders, M$3k, a month) left the screener with a thin pool
# of the same large markets, and a mispricing is likelier on a question fewer people
# have bothered to price than on one everybody is already staring at.
min_unique_bettors = 12
min_volume = 800
max_days_to_resolve = 30
min_hours_to_resolve = 6
skip_if_seen_within_hours = 24
# A market it already analysed comes back only if the price moved this much since it
# looked, or after this many days. A plain 24h cooldown brought every market back daily
# as if new, and markets it held were re-bought at full size each time.
rescan_on_move = 0.08
rescan_after_days = 7

[agency]
# The desk: the agent's own turn, run by the deep model. It sees every position, its
# cash, a watchlist of markets it forecast with an edge but could not afford, who it
# owes, and its track record, and decides directly: buy from the watchlist, add, sell,
# pay people, keep notes. Code applies the [risk] limits afterwards. This replaced a
# cheap-model own turn plus a cheap-model book review whose trades a deep model then
# vetoed or approved; that setup wrote the same "liquidity frozen" note every hour.
#
# Positions are held to resolution by default; the desk sells when something has
# actually changed. The price-move re-evaluation in [watch] is the other way out.
#
# It does not need to make many money decisions. Most turns are skipped because nothing
# changed, so in practice this is a few deep-model calls a day at most.
enabled = true
min_minutes_between_actions = 240   # earliest it may run again after a turn
idle_hours = 12                     # skips turns when nothing changed, but not longer than this
max_actions_per_turn = 5
allow_send_mana = true
watchlist_days = 4                  # how long an unaffordable forecast stays buyable

[forecast]
# Hide the market price while the model is forecasting. Shown the price, it hands the
# price back: early runs put five of six estimates within two points of market, which
# produces no edge and no trades. Set false to let it see the price and anchor.
blind = true

[risk]
# Ordinary trades are capped as a share of net worth, floored at default_max_bet so a
# small account can still do something. A flat M$10 cap made every position identical
# regardless of how strong the edge was, which is dull and learns nothing.
default_max_bet = 10
default_max_fraction = 0.10
# Only ever buy the side the market already favours, and only when the model is more
# confident in it than the market is. On the agent's own resolved record to September
# 2026, favourite bets won 17 of 20 and longshot bets against the favourite won 13 of
# 70. Backtested on 111 resolved forecasts, every favourite-only threshold made money
# and every rule that allowed longshots lost about 45% per bet. Set false to go back
# to betting whichever way the model disagrees.
favourites_only = true
# Minimum disagreement, in log-odds. 0.2 is about 1.5 points at 95% and about 5 at 50%,
# so it is loose where the model has been well calibrated (the tails) and strict where
# it has not (the middle).
min_edge_logodds = 0.2
min_bet = 8                   # floor, so a thin edge is still a real position
kelly_fraction = 0.4          # raise toward 0.7 if you want the conviction cap to bind

# All four gates have to pass at once for a big position. At the original settings
# (M$10k volume, 7 days, 18pp edge, high confidence) nothing ever cleared them.
conviction_max_fraction = 0.35
conviction_min_volume = 5000
conviction_max_days = 14
conviction_min_edge = 0.12
conviction_min_confidence = "medium"

# Every order is a limit order, so its price impact is capped by its own limit price.
# That replaced the old impact and share-of-volume caps, which were what kept
# positions small in thin markets.
max_open_positions = 40
daily_mana_budget = 500
# Cash held back from every order. At 50 against a balance that had drifted down to
# M$50 this silently floored every trade to zero for a day and a half: the agent kept
# finding edges, kept sizing them at nothing, and read that as the market being fine.
# Keep it small; it is a buffer against fees, not a risk control.
min_balance_reserve = 10
time_decay_days = 10

[watch]
move_threshold = 0.08         # pp move on a held market that forces a re-evaluation
# Ticks run every minute; without this a market in freefall would burn an evaluation
# every tick on the way down.
reevaluate_cooldown_minutes = 45

[social]
# Posting costs M$1, so the bot introduces itself only on a position big enough that the
# fee is noise, and only once per market. It still answers replies to that comment for
# free, forever, and stays quiet on every later trade in the same market.
comment_decisions = true
comment_min_amount = 50
reply_to_comments = true
# Off by default: a managram is the only way to answer a managram, and the API minimum
# is M$10 per send, so every reply costs real bankroll.
reply_to_managrams = false
# Questions asked through the website arrive as labelled GitHub issues.
answer_github_issues = true
# Ask creators to resolve markets that closed and never did, with a polite comment
# that says the agent holds a position. M$1 each, biggest stake first, at most twice
# per market and a couple a day. There is no API for requesting a resolution.
nudge_unresolved = true
nudge_after_days = 3
nudge_min_value = 15
max_nudges_per_day = 2
# Minimum gap between replies in the same thread. Without it a busy thread gets one
# reply per message, because every answer draws another comment which triggers another
# answer. It only ever answers the newest message anyway, so waiting costs nothing but
# the replies to messages the conversation had already moved past.
issue_reply_cooldown_minutes = 15
max_replies_per_tick = 2
watch_last_n_comments = 10    # how far back to look for replies to the bot

[memory]
path = "state"
# Compress on whichever comes first: enough decisions, enough hours, or a full journal.
# Events alone never fires on a quiet day and the context just grows.
compress_after_events = 60
compress_after_hours = 8
# Running observations, written by plain code on every tick and folded into the summary
# when it is next rewritten. Recording is free, so it notices everything and decides
# later what was worth keeping.
max_journal = 300
journal_in_context = 30
# Standing notes the agent wrote for itself or was given by someone it talked to.
# These sit in front of every decision, so the list stays short on purpose.
max_lessons = 16
conversation_depth = 12       # turns of one conversation it can still see
max_conversations = 40

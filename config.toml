# Settings only. This file is committed, so it holds no keys.
# Secrets come from the environment: MANIFOLD_API_KEY and LLM_API_KEY.

[manifold]
# Master safety switch. While true, orders and comments are logged, never sent.
# Set back to true at any time to ground the bot without stopping the workflow.
dry_run = false

[llm]
# Three models. Anything set here is the shared default; the tables below override it.
# Point them all at the same model if you would rather not think about it.
#
# provider is one of: gemini | mistral | openai_compatible
#
# Gemini is only worth it if your Google project is actually allowed to make free
# calls, which not every account gets. Run `python run.py --check` to find out before
# committing to it. Mistral, Groq, Cerebras and OpenRouter all have free tiers that do
# not ask for a card, and the research step falls back to keyless DuckDuckGo search on
# any provider without native grounding.
provider = "gemini"
base_url = ""
use_search = true             # false skips the research call entirely
search_results = 6
temperature = 0.3
timeout_seconds = 90
key_env = "LLM_API_KEY"       # which environment variable holds the key

# Every tier takes `fallbacks`: models tried in order when the preferred one is out of
# quota or refuses the key. A daily free quota runs out before the day does, and a
# lesser model is better than the agent going dark until midnight.

# Screens every candidate market and does the research. Highest call volume, so it
# wants the model with the generous rate limit rather than the clever one.
[llm.fast]
model = "gemini-3.5-flash-lite"
fallbacks = ["gemini-3.5-flash"]

# Talks to people and rewrites memory. A small conversational model is plenty here and
# it keeps chatter off the quota the trading decisions need. Point this at a Gemma if
# you have one, for example model = "gemma-3-27b-it".
[llm.chat]
model = "gemini-3.5-flash-lite"
fallbacks = ["gemini-3.5-flash"]

# Only ever asked the question that decides money. To run a second provider here, set
# its own provider/base_url/key_env and add that key to Actions secrets, for example:
#   provider = "openai_compatible"
#   base_url = "https://api.groq.com/openai/v1"
#   model = "llama-3.3-70b-versatile"
#   key_env = "DEEP_LLM_API_KEY"
[llm.deep]
model = "gemini-3.6-flash"
fallbacks = ["gemini-3.5-flash", "gemini-3.5-flash-lite"]

[screen]
# The fast model forecasts each candidate blind, and the deep model only sees markets
# where that quick number disagrees with the price or where the screener flagged
# something worth reading properly. The screener is coarse, so the disagreement has to
# be sizeable before it counts as evidence: at 0.03 nearly everything escalated and the
# deep model's quota went on questions that were fairly priced all along.
enabled = true
escalate_edge = 0.07

[budget]
# Sized for a small free tier. Ticks run 60 seconds apart, so the per-tick numbers are
# effectively per-minute rate limits; keep each under the RPM your provider gives you.
# The per-day numbers are the ones that keep a daily quota alive to the end of the day,
# and they are tracked in state across ticks. Screened-out markets do not count against
# the evaluation cap, so a tick can look at several questions and analyse the one that
# looked wrong. Each analysis costs one deep call plus one fast call for research.
max_evaluations_per_tick = 2
max_fast_calls_per_tick = 6
max_chat_calls_per_tick = 3
max_deep_calls_per_tick = 2
max_fast_calls_per_day = 400
max_chat_calls_per_day = 200
max_deep_calls_per_day = 120

[scan]
min_minutes_between_scans = 20
min_unique_bettors = 25
min_volume = 3000
max_days_to_resolve = 30
min_hours_to_resolve = 6
skip_if_seen_within_hours = 48

[forecast]
# Hide the market price while the model is forecasting. Shown the price, it hands the
# price back: early runs put five of six estimates within two points of market, which
# produces no edge and no trades. Set false to let it see the price and anchor.
blind = true

[risk]
# Ordinary trades are capped as a share of net worth, floored at default_max_bet so a
# small account can still do something. A flat M$10 cap made every position identical
# regardless of how strong the edge was, which is dull and learns nothing.
default_max_bet = 10
default_max_fraction = 0.10
# A 4-point disagreement is a real, if weak, opinion and deserves a small position.
# Kelly already scales the stake with the edge, so a marginal call gets marginal money
# rather than nothing. Lower means more trades and a much faster calibration record.
min_edge = 0.04
min_bet = 8                   # floor, so a thin edge is still a real position
kelly_fraction = 0.4          # raise toward 0.7 if you want the conviction cap to bind

# All four gates have to pass at once for a big position. At the original settings
# (M$10k volume, 7 days, 18pp edge, high confidence) nothing ever cleared them.
conviction_max_fraction = 0.35
conviction_min_volume = 5000
conviction_max_days = 14
conviction_min_edge = 0.12
conviction_min_confidence = "medium"

max_market_impact = 0.05      # never move the price more than 5pp with one order
max_share_of_volume = 0.05
max_open_positions = 40
daily_mana_budget = 500
min_balance_reserve = 50
time_decay_days = 14

[watch]
move_threshold = 0.08         # pp move on a held market that forces a re-evaluation
# Ticks run every minute; without this a market in freefall would burn an evaluation
# every tick on the way down.
reevaluate_cooldown_minutes = 45

[social]
# Posting costs M$1, so the bot introduces itself only on a position big enough that the
# fee is noise, and only once per market. It still answers replies to that comment for
# free, forever, and stays quiet on every later trade in the same market.
comment_decisions = true
comment_min_amount = 50
reply_to_comments = true
# Off by default: a managram is the only way to answer a managram, and the API minimum
# is M$10 per send, so every reply costs real bankroll.
reply_to_managrams = false
# Questions asked through the website arrive as labelled GitHub issues.
answer_github_issues = true
max_replies_per_tick = 2
watch_last_n_comments = 10    # how far back to look for replies to the bot

[memory]
path = "state"
compress_after_events = 60
# Standing notes the agent wrote for itself or was given by someone it talked to.
# These sit in front of every decision, so the list stays short on purpose.
max_lessons = 16
conversation_depth = 12       # turns of one conversation it can still see
max_conversations = 40

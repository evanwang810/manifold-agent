[project]
name = "manifold-agent"
version = "0.2.0"
description = "Autonomous LLM trading agent for Manifold Markets"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent"]
